name: Build Lucifer APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o lucifer.zip -d lucifer

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        working-directory: lucifer
        run: gradle assembleDebug --stacktrace

      - name: Run unit tests
        working-directory: lucifer
        continue-on-error: true
        run: gradle testDebugUnitTest

      - name: Rename APK
        run: cp lucifer/app/build/outputs/apk/debug/app-debug.apk Lucifer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lucifer-APK
          path: Lucifer.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lucifer build ${{ github.run_number }}
          files: Lucifer.apk
